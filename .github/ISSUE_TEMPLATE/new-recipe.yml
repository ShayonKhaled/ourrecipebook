name: New recipe
description: Add a recipe to the book.
title: "[Recipe]: "
labels: ["new recipe"]
body:
  - type: input
    id: title
    attributes:
      label: Name
      placeholder: "Lemon garlic pasta"
    validations:
      required: true

  - type: upload
    id: photo
    attributes:
      label: Photo
      description: Optional. Landscape looks best.

  - type: textarea
    id: description
    attributes:
      label: About
      description: Optional. A sentence or two.
      placeholder: "The pasta we make when it is already late and nobody wants to think."

  - type: textarea
    id: ingredients
    attributes:
      label: Ingredients
      description: One per line.
      placeholder: |
        400 g spaghetti
        6 cloves garlic
        1 lemon
    validations:
      required: true

  - type: textarea
    id: method
    attributes:
      label: Method
      description: One step per line.
      placeholder: |
        1. Boil the water and salt it well.
        2. Warm the oil and cook the garlic gently.
        3. Add the pasta and toss with lemon and cheese.
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Optional. Anything worth remembering.
      placeholder: "The cheese goes in off the heat, otherwise it clumps."

  - type: input
    id: tags
    attributes:
      label: Tags
      description: Optional. Separate with commas.
      placeholder: "pasta, vegetarian, weeknight"
