name: Publish recipe from issue

on:
  issues:
    # reopened is the retry path: if publishing failed, reopening the issue runs
    # it again rather than making someone re-type the whole recipe.
    types: [opened, reopened]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: recipe-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  publish:
    if: contains(github.event.issue.labels.*.name, 'new recipe')
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.publish.outputs.published }}
      url: ${{ steps.publish.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check --quiet pillow

      - name: Fetch photo
        id: photo
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          url="$(printf '%s\n' "$ISSUE_BODY" \
            | grep -oE 'https://github\.com/user-attachments/assets/[A-Za-z0-9._/-]+' \
            | head -n 1 || true)"

          if [ -z "$url" ]; then
            echo "status=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! curl -sSL --fail --max-time 180 \
                 -H "Authorization: Bearer $GH_TOKEN" -o photo.tmp "$url"; then
            echo "status=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! head -c 4 photo.tmp | grep -qE $'^\xff\xd8\xff|^\x89PNG|^GIF8|^RIFF'; then
            echo "status=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mv photo.tmp photo.upload
          echo "status=saved" >> "$GITHUB_OUTPUT"

      - name: Build the recipe
        id: build
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          PHOTO_STATUS: ${{ steps.photo.outputs.status }}
          PHOTO_NAME: image.jpeg
        run: |
          set -euo pipefail

          output="$(python _tools/recipe_from_issue.py)"
          echo "$output"
          result="$(printf '%s\n' "$output" | sed -n 's/^RESULT://p' | head -n 1)"

          case "$result" in
            created)
              dir="$(printf '%s\n' "$output" | sed -n 's/^dir=//p' | head -n 1 | tr -d '\r')"
              echo "dir=$dir" >> "$GITHUB_OUTPUT"
              echo "outcome=created" >> "$GITHUB_OUTPUT"
              if [ "$PHOTO_STATUS" = "saved" ]; then
                mv photo.upload "$dir/image.jpeg"
              else
                title="$(printf '%s\n' "$ISSUE_BODY" \
                  | sed -n '/^### Name$/{n;p;q;}' \
                  | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
                python _tools/make_placeholder.py "$title" "$dir/image.jpeg"
              fi
              ;;
            duplicate:*)
              echo "outcome=duplicate" >> "$GITHUB_OUTPUT"
              echo "existing=${result#duplicate:}" >> "$GITHUB_OUTPUT"
              ;;
            missing-title)
              echo "outcome=missing-title" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unexpected parser result: $result"
              exit 1
              ;;
          esac

      - name: Duplicate
        if: steps.build.outputs.outcome == 'duplicate'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          EXISTING: ${{ steps.build.outputs.existing }}
        run: |
          gh issue comment "$ISSUE" --body "There is already a recipe called **$EXISTING**. If this is a different dish, edit the title above to make it distinct and submit again."

      - name: Missing name
        if: steps.build.outputs.outcome == 'missing-title'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE" --body "The **Name** box was empty, so there was nothing to publish. Reply with the name and it can be added."

      - name: Commit
        id: publish
        if: steps.build.outputs.outcome == 'created'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSH_TOKEN: ${{ secrets.RECIPE_PUSH_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          if [ -z "${PUSH_TOKEN:-}" ]; then
            echo "::error::RECIPE_PUSH_TOKEN is not set."
            exit 1
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/posts
          git commit -m "Add recipe from issue #$ISSUE"
          git remote set-url origin \
            "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          pushed=false
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            git pull --rebase origin main
          done
          [ "$pushed" = "true" ] || { echo "::error::Push failed."; exit 1; }

          slug="$(basename "${{ steps.build.outputs.dir }}")"
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "url=https://shayonkhaled.github.io/ourrecipebook/posts/$slug/" >> "$GITHUB_OUTPUT"
          gh issue comment "$ISSUE" --body "Published: https://shayonkhaled.github.io/ourrecipebook/posts/$slug/"
          gh issue close "$ISSUE" --reason completed

      - name: Failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE" --body "Could not publish automatically. The recipe is still here in this issue. Close and reopen it to try again."

  # A push made by a workflow does not start another workflow, so the normal
  # Pages deploy never runs for the commit above. Deploy here instead.
  deploy:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      HUGO_VERSION: 0.161.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Hugo
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: hugo --minify --gc --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
